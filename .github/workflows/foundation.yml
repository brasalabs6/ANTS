name: Foundation
on:
  pull_request:
  push:
    branches: [main, 'feat/r01-*']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2.0.2
        with:
          bun-version: '1.3.5'
      - run: bun install --frozen-lockfile
      - run: bun run check
      - run: git diff --exit-code -- bun.lock
      - name: Checksums
        run: cd dist && sha256sum ants ants-sqlite-smoke > SHA256SUMS
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ants-linux-x64
          path: |
            dist/ants
            dist/ants-sqlite-smoke
            dist/SHA256SUMS
          if-no-files-found: error
  clean-linux:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    container: debian:bookworm-slim
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ants-linux-x64
      - name: Verify and run standalone binaries without installed runtime
        shell: sh
        run: |
          set -eu
          if command -v bun || command -v node; then exit 1; fi
          sha256sum -c SHA256SUMS
          chmod +x ants ants-sqlite-smoke
          ./ants --help
          ./ants --version --json
          ./ants-sqlite-smoke
          if ./ants invalid-command --json; then exit 1; else test "$?" -eq 2; fi
