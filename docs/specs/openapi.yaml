openapi: 3.1.0
info:
  title: ANTS API (draft subset)
  version: 0.1.0
servers:
  - url: http://localhost:3000/v1
security:
  - bearerAuth: []
paths:
  /orgs/{orgId}/colonies/{colonyId}/missions/{missionId}:
    parameters:
      - $ref: '#/components/parameters/orgId'
      - $ref: '#/components/parameters/colonyId'
      - $ref: '#/components/parameters/missionId'
    get:
      operationId: getMission
      responses:
        '200':
          description: Authorized mission summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Mission'
        '404':
          $ref: '#/components/responses/Problem'
  /orgs/{orgId}/colonies/{colonyId}/missions/{missionId}/tasks/{taskId}/claim:
    parameters:
      - $ref: '#/components/parameters/orgId'
      - $ref: '#/components/parameters/colonyId'
      - $ref: '#/components/parameters/missionId'
      - name: taskId
        in: path
        required: true
        schema: {type: string, format: uuid}
    post:
      operationId: claimTask
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          schema: {type: string, minLength: 1, maxLength: 128}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [sessionId, missionRevision]
              properties:
                sessionId: {type: string, format: uuid}
                missionRevision: {type: integer, minimum: 1}
      responses:
        '200':
          description: Lease granted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lease'
        '401': {$ref: '#/components/responses/Problem'}
        '404': {$ref: '#/components/responses/Problem'}
        '409': {$ref: '#/components/responses/Problem'}
        '429': {$ref: '#/components/responses/Problem'}
components:
  securitySchemes:
    bearerAuth: {type: http, scheme: bearer}
  parameters:
    orgId: {name: orgId, in: path, required: true, schema: {type: string, format: uuid}}
    colonyId: {name: colonyId, in: path, required: true, schema: {type: string, format: uuid}}
    missionId: {name: missionId, in: path, required: true, schema: {type: string, format: uuid}}
  schemas:
    Mission:
      type: object
      required: [id, goal, revision, state]
      properties:
        id: {type: string, format: uuid}
        goal: {type: string}
        revision: {type: integer, minimum: 1}
        state: {type: string, enum: [draft, active, paused, completed, cancelled]}
    Lease:
      type: object
      required: [taskId, sessionId, fence, expiresAt]
      properties:
        taskId: {type: string, format: uuid}
        sessionId: {type: string, format: uuid}
        fence: {type: string, pattern: '^[1-9][0-9]*$'}
        expiresAt: {type: string, format: date-time}
    Problem:
      type: object
      required: [type, title, status]
      properties:
        type: {type: string}
        title: {type: string}
        status: {type: integer}
        detail: {type: string}
        requestId: {type: string}
  responses:
    Problem:
      description: RFC 9457 problem
      content:
        application/problem+json:
          schema: {$ref: '#/components/schemas/Problem'}
